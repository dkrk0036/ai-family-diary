name: Event editor regression tests
on:
  pull_request:
  push:
    branches:
      - fix/event-editor-validation-20261031
jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run edit and delete regression tests
        run: node tests/event-editor.test.js
