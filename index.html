<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>우리집 AI 다이어리</title><link rel="stylesheet" href="style.css"></head><body><main class="desk"><section class="book">
<div class="top"><div><span class="tape">MONTHLY</span><h1>우리집 <em>AI 다이어리</em> ♡</h1><p>우리 가족의 하루를 차곡차곡 기록해요.</p></div><div class="mascot">ʕ•ᴥ•ʔ<br><small>오늘도 같이 해요!</small></div></div>
<section class="assistant"><div class="face">૮₍ ˶ᵔ ᵕ ᵔ˶ ₎ა</div><div class="assistantBody"><b>AI 비서에게 일정 말하기</b><p id="bubble">“10월 5일 첫째 치과 오후 4시”처럼 편하게 적어 주세요.</p><form id="quick"><input id="natural" placeholder="예: 29일 저녁 약속" autocomplete="off"><button>+ 일정 넣기</button></form></div></section>
<div class="calendarHead"><button id="prev">‹</button><div><small>MONTHLY PLANNER</small><h2 id="monthTitle"></h2></div><button id="next">›</button></div>
<div class="legend"><span class="work">● 어린이집</span><span class="kid">● 아이</span><span class="me">● 내 일정</span><span class="spouse">● 배우자/가족</span></div>
<section class="paper"><div class="binding"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="week"><b>일</b><b>월</b><b>화</b><b>수</b><b>목</b><b>금</b><b>토</b></div><div id="grid"></div><div class="paperDeco">✿　♡　⌁</div></section>
<footer><button id="today">⌂ 오늘</button><span>little moments, big memories ♡</span><button id="theme">✿ 테마</button></footer></section></main>
<dialog id="detail"><div class="sheet"><button id="close" class="x">×</button><span class="memoTape">MY SCHEDULE ♡</span><h3>일정 상세</h3><label>일정<input id="dtitle"></label><div class="two"><label>날짜<input id="ddate" type="date"></label><label>시간<input id="dtime" type="time"></label></div><label>분류<select id="dcat"><option value="work">어린이집</option><option value="kid">아이</option><option value="me">내 일정</option><option value="spouse">배우자/가족</option></select></label><label>장소<input id="dplace" placeholder="장소"></label><label>메모<textarea id="dmemo" placeholder="준비물이나 메모를 적어요"></textarea></label><div class="actions"><button id="copy">복사</button><button id="delete">삭제</button><button id="save">저장 ♡</button></div></div></dialog><script src="app.js"></script></body></html>
