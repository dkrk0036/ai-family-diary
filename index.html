<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#efe5d8"><title>우리집 AI 총괄비서</title><link rel="stylesheet" href="style.css?v=11"></head><body>
<div class="shell">
<aside class="side"><div class="brand"><svg viewBox="0 0 64 64"><path d="M8 31L32 9l24 22v25H8z" fill="#f8d7c7" stroke="#64534c" stroke-width="2"/><path d="M5 32L32 6l27 26" fill="none" stroke="#64534c" stroke-width="4"/><rect x="25" y="38" width="14" height="18" rx="2" fill="#a9d2d0"/><path d="M17 26h9v9h-9zM39 26h9v9h-9z" fill="#fff9ef"/></svg><b>우리집<br>AI 총괄비서</b><span>♥</span></div><button id="aiOpen" class="add">＋ 일정 추가하기</button><nav><button class="active">▣ <span>캘린더</span></button><button>☑ <span>할 일 목록</span></button><button>▤ <span>메모 노트</span></button><button>♡ <span>장보기 목록</span></button><button>♧ <span>가족 정보</span></button><button id="theme">◉ <span>테마 설정</span></button><button class="ask">● <span>AI에게 물어보기</span></button></nav><div class="cats"><div><b>가족 일정 카테고리</b><small>편집</small></div><p><i class="c-work"></i>어린이집</p><p><i class="c-kid"></i>아이</p><p><i class="c-me"></i>내 일정</p><p><i class="c-spouse"></i>배우자</p><p><i class="c-family"></i>가족</p><p><i class="c-hospital"></i>병원</p><p><i class="c-etc"></i>기타</p></div></aside>
<main class="planner"><div class="tabs"><button class="on">월간</button><button>주간</button><button>일간</button><button>할 일</button><button>메모</button></div><div class="plannerHead"><div class="monthNav"><button id="prev">‹</button><h1 id="monthTitle"></h1><button id="next">›</button></div><div class="mascot"><img class="bunnySticker" src="assets/bunny-sticker.svg?v=11" alt=""><div>오늘도 좋은 하루예요!<br><b>오늘 일정 3개가 있어요 ♥</b></div></div><button id="today" class="today">오늘</button></div>
<section class="calendar"><div class="week"><b>일</b><b>월</b><b>화</b><b>수</b><b>목</b><b>금</b><b>토</b></div><div id="grid"></div><div class="bear"><b>FIGHTING!</b><img class="bearSticker" src="assets/bear-sticker.svg?v=11" alt=""><small>이번 주도<br>수고했어요!</small></div></section></main>
<aside class="detailPanel"><div class="detailTop"><span></span><button id="panelClose">×</button></div><div class="detailBody"><div class="detailTitle"><h2 id="pTitle">🥂 저녁 약속 ♥</h2><button id="editBtn">수정</button></div><dl><div><dt>▣</dt><dd id="pDate">2026년 9월 29일 (화)</dd></div><div><dt>◷</dt><dd id="pTime">19:00 - 21:00</dd></div><div><dt>♙</dt><dd id="pCat">내 일정</dd></div><div><dt>⌖</dt><dd id="pPlace">미정 (추후 확인)</dd></div></dl><section class="note"><h3>▤ 메모</h3><p id="pMemo">저녁 약속<br>시간과 장소는 추후 확정하기</p></section><section class="check"><h3>🍏 체크리스트</h3><label><input type="checkbox"> 장소 정하기</label><label><input type="checkbox"> 준비물 확인 (필요시)</label><label><input type="checkbox"> 아이들 저녁 확인</label></section><div class="panelActions"><button id="panelEdit">수정하기</button><button id="panelDelete">삭제하기</button><button id="panelCopy">복사하기</button></div></div></aside>
</div>
<dialog id="aiDialog"><div class="sheet"><button class="x" data-close="aiDialog">×</button><span>AI SECRETARY</span><h3>일정을 말해줘</h3><p id="bubble">“29일 저녁 7시 약속”처럼 편하게 적어도 돼.</p><form id="quick"><input id="natural" placeholder="예: 10월 5일 첫째 치과 오후 4시"><button>달력에 넣기</button></form></div></dialog>
<dialog id="detail"><div class="sheet"><button id="close" class="x">×</button><h3>일정 수정</h3><label>일정<input id="dtitle"></label><div class="two"><label>날짜<input id="ddate" type="date"></label><label>시간<input id="dtime" type="time"></label></div><label>분류<select id="dcat"><option value="work">어린이집</option><option value="kid">아이</option><option value="me">내 일정</option><option value="spouse">배우자/가족</option></select></label><label>장소<input id="dplace"></label><label>메모<textarea id="dmemo"></textarea></label><div class="actions"><button id="copy">복사</button><button id="delete">삭제</button><button id="save">저장</button></div></div></dialog>
<script src="app.js?v=11"></script><script>aiOpen.onclick=()=>aiDialog.showModal();document.querySelector('[data-close="aiDialog"]').onclick=()=>aiDialog.close();</script></body></html>
