<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리집 AI 다이어리</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><aside><div class="logo">우리집<br><b>AI 다이어리</b><span>♡</span></div><nav><button class="active">▦ 먼슬리</button><button id="themeBtn">✿ 테마</button><button id="todayBtn">⌂ 오늘</button></nav><div class="sticker">૮ ˶ᵔ ᵕ ᵔ˶ ა<br><small>AI 비서가<br>함께 정리해요</small></div></aside>
<main><header><div><small class="label">MONTHLY PLANNER</small><h1 id="monthTitle"></h1><p>가족의 하루를 한 장에 차곡차곡.</p></div><div class="monthNav"><button id="prev">‹</button><button id="next">›</button></div></header>
<section class="ai"><div class="bunny">૮₍ ˃ ⤙ ˂ ₎ა</div><div><b>AI 비서에게 일정 말하기</b><p id="aiMsg">“10월 5일 첫째 치과 오후 4시”처럼 편하게 적어 주세요.</p><form id="quick"><input id="natural" autocomplete="off" placeholder="예: 29일 저녁 약속"><button>일정 넣기</button></form></div></section>
<div class="legend"><span class="work">어린이집</span><span class="kid">아이</span><span class="me">내 일정</span><span class="spouse">배우자/가족</span></div>
<section class="paper"><div class="rings">○ ○ ○ ○ ○ ○ ○ ○</div><div class="week"><b>일</b><b>월</b><b>화</b><b>수</b><b>목</b><b>금</b><b>토</b></div><div id="grid"></div></section>
</main></div>
<dialog id="detail"><div class="sheet"><button class="close" id="close">×</button><div class="detailSticker">TODAY ♡</div><label>일정<input id="dtitle"></label><div class="two"><label>날짜<input id="ddate" type="date"></label><label>시간<input id="dtime" type="time"></label></div><label>분류<select id="dcat"><option value="work">어린이집</option><option value="kid">아이</option><option value="me">내 일정</option><option value="spouse">배우자/가족</option></select></label><label>장소<input id="dplace" placeholder="장소"></label><label>메모<textarea id="dmemo" placeholder="준비물이나 메모"></textarea></label><div class="actions"><button id="copy">복사</button><button class="danger" id="delete">삭제</button><button class="primary" id="save">저장</button></div></div></dialog>
<script src="app.js"></script></body></html>
