<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>우리집 AI 다이어리</title><link rel="stylesheet" href="style.css"></head><body>
<main class="app"><section class="diary">
<header class="hero"><div><span class="washitape">OUR FAMILY</span><h1>우리집 <i>AI 다이어리</i></h1><p>작은 하루도 소중하게 기록해요.</p></div><svg class="art" viewBox="0 0 160 105" aria-hidden="true"><ellipse cx="79" cy="88" rx="61" ry="12" fill="#eadfd2"/><circle cx="65" cy="48" r="29" fill="#f2c8ad"/><path d="M42 39Q65 8 88 39" fill="#73584c"/><circle cx="55" cy="49" r="2.5" fill="#59483f"/><circle cx="74" cy="49" r="2.5" fill="#59483f"/><path d="M58 60q7 7 14 0" fill="none" stroke="#a46e67" stroke-width="2" stroke-linecap="round"/><circle cx="111" cy="61" r="20" fill="#fffaf2" stroke="#cda98e" stroke-width="2"/><path d="M96 49l-8-10 15 5M124 49l8-10-15 5" fill="#d5ad91"/><circle cx="105" cy="60" r="2.3"/><circle cx="117" cy="60" r="2.3"/><path d="M108 68q4 4 8 0" fill="none" stroke="#725b50" stroke-width="2" stroke-linecap="round"/><path d="M34 80q31-21 61 0v17H34z" fill="#dcaab3"/><path d="M94 79q18-12 34 1v16H94z" fill="#b8cfae"/></svg></header>
<section class="monthTop"><button id="prev">‹</button><div><small>MONTHLY PLANNER</small><h2 id="monthTitle"></h2></div><button id="next">›</button></section>
<nav class="legend"><span class="work"><b></b>어린이집</span><span class="kid"><b></b>아이</span><span class="me"><b></b>내 일정</span><span class="spouse"><b></b>가족</span></nav>
<section class="calendar"><div class="rings"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="week"><b>일</b><b>월</b><b>화</b><b>수</b><b>목</b><b>금</b><b>토</b></div><div id="grid"></div></section>
<section class="notes"><article class="sticky pink"><span class="pin"></span><h3>오늘의 메모</h3><p>해야 할 일은 하나씩, 천천히 ♡</p></article><article class="sticky yellow"><span class="pin"></span><h3>이번 주</h3><p>가족의 중요한 일정을 놓치지 않기</p></article></section>
<footer><button id="today">오늘</button><span>little moments, big memories</span><button id="theme">꾸미기</button></footer>
<button id="aiOpen" class="ai"><svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="24" fill="#fff8f0"/><path d="M13 25q14-20 28 0v16H13z" fill="#dcaab3"/><circle cx="22" cy="25" r="2"/><circle cx="32" cy="25" r="2"/><path d="M22 32q5 5 10 0" fill="none" stroke="#74564f" stroke-width="2" stroke-linecap="round"/></svg><span><b>AI 비서</b><small>일정 말하기</small></span></button>
</section></main>
<dialog id="aiDialog"><div class="sheet"><button class="x" data-close="aiDialog">×</button><span class="label">AI SECRETARY</span><h3>새 일정이 생겼어?</h3><p id="bubble">말하듯 적으면 내가 달력에 정리할게.</p><form id="quick"><input id="natural" placeholder="예: 10월 5일 첫째 치과 오후 4시"><button>일정 넣기</button></form></div></dialog>
<dialog id="detail"><div class="sheet"><button id="close" class="x">×</button><span class="label">MY SCHEDULE</span><h3>일정 상세</h3><label>일정<input id="dtitle"></label><div class="two"><label>날짜<input id="ddate" type="date"></label><label>시간<input id="dtime" type="time"></label></div><label>분류<select id="dcat"><option value="work">어린이집</option><option value="kid">아이</option><option value="me">내 일정</option><option value="spouse">배우자/가족</option></select></label><label>장소<input id="dplace"></label><label>메모<textarea id="dmemo"></textarea></label><div class="actions"><button id="copy">복사</button><button id="delete">삭제</button><button id="save">저장</button></div></div></dialog>
<script src="app.js"></script><script>aiOpen.onclick=()=>aiDialog.showModal();document.querySelector('[data-close="aiDialog"]').onclick=()=>aiDialog.close();quick.addEventListener('submit',()=>setTimeout(()=>aiDialog.close(),150));</script></body></html>
