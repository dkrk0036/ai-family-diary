<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>우리집 AI 다이어리</title><link rel="stylesheet" href="style.css"></head><body><main class="desk"><section class="planner"><div class="scrap s1">✿</div><div class="scrap s2">♡</div><div class="scrap s3">⌁</div>
<header><div><span class="tape">SEPTEMBER</span><h1>우리집의 <em>작은 기록</em> ♡</h1></div><div class="heroSticker"><div class="mom">◡̈</div><div class="pup">•ᴥ•</div><small>오늘도 소중한 하루 ♡</small></div></header>
<div class="monthbar"><button id="prev">‹</button><div><small>MONTHLY PLANNER</small><h2 id="monthTitle"></h2></div><button id="next">›</button></div>
<div class="legend"><span class="work">● 어린이집</span><span class="kid">● 아이</span><span class="me">● 내 일정</span><span class="spouse">● 가족</span></div>
<section class="paper"><div class="clip">〰　〰　〰　〰　〰</div><div class="week"><b>일</b><b>월</b><b>화</b><b>수</b><b>목</b><b>금</b><b>토</b></div><div id="grid"></div><span class="doodle d1">♡</span><span class="doodle d2">✿</span></section>
<section class="miniPanels"><div class="memoCard"><b>오늘</b><span>☐ 민속놀이 행사일지 작성</span><span>☐ 저녁 메뉴 정하기</span></div><div class="weekCard"><b>이번 주</b><span>28 민속놀이 행사</span><span>29 저녁 약속</span><span>30 아이 정형외과</span></div></section><div class="bottom"><button id="today">⌂ 오늘</button><span>make today lovely ♡</span><button id="theme">✿ 꾸미기</button></div>
<button id="aiOpen" class="aiFab"><span>૮₍˶ᵔ ᵕ ᵔ˶₎ა</span><b>AI 비서</b><small>일정 말하기</small></button>
</section></main>
<dialog id="aiDialog"><div class="aiSheet"><button class="x" data-close="aiDialog">×</button><span class="pinkTape">AI SECRETARY</span><h3>무슨 일정이 생겼어?</h3><p id="bubble">말하듯 적으면 달력에 붙여둘게 ♡</p><form id="quick"><input id="natural" placeholder="예: 10월 5일 첫째 치과 오후 4시" autocomplete="off"><button>붙이기 ♡</button></form><div class="example">“29일 저녁 약속”　 “내일 어린이집 준비물 챙기기”</div></div></dialog>
<dialog id="detail"><div class="sheet"><button id="close" class="x">×</button><span class="pinkTape">MY SCHEDULE</span><h3>오늘의 기록 ♡</h3><label>일정<input id="dtitle"></label><div class="two"><label>날짜<input id="ddate" type="date"></label><label>시간<input id="dtime" type="time"></label></div><label>분류<select id="dcat"><option value="work">어린이집</option><option value="kid">아이</option><option value="me">내 일정</option><option value="spouse">배우자/가족</option></select></label><label>장소<input id="dplace" placeholder="장소"></label><label>메모<textarea id="dmemo" placeholder="준비물이나 메모"></textarea></label><div class="actions"><button id="copy">복사</button><button id="delete">삭제</button><button id="save">저장 ♡</button></div></div></dialog><script src="app.js"></script><script>document.getElementById('aiOpen').onclick=()=>document.getElementById('aiDialog').showModal();document.querySelector('[data-close="aiDialog"]').onclick=()=>document.getElementById('aiDialog').close();document.getElementById('quick').addEventListener('submit',()=>setTimeout(()=>document.getElementById('aiDialog').close(),250));</script></body></html>
