<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#efe6dc"><title>우리집 AI 다이어리</title><link rel="stylesheet" href="style.css?v=6"></head><body>
<main class="desk"><section class="book"><div class="binding" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="page">
<div class="decor decor1"><svg viewBox="0 0 120 90"><path d="M17 71C22 38 44 18 75 19c23 1 35 16 28 34-8 21-34 28-57 26" fill="#f5d6dd" stroke="#765e57" stroke-width="2"/><path d="M52 25C47 5 61 3 69 20M80 22C89 4 101 11 95 31" fill="#fffaf3" stroke="#765e57" stroke-width="2"/><circle cx="68" cy="43" r="2.5"/><circle cx="83" cy="43" r="2.5"/><path d="M71 52q5 5 10 0" fill="none" stroke="#765e57" stroke-width="2" stroke-linecap="round"/><path d="M30 73q-10-19-21-7M34 67Q20 51 9 57" fill="none" stroke="#91aa82" stroke-width="4" stroke-linecap="round"/></svg></div>
<div class="decor decor2"><svg viewBox="0 0 100 80"><path d="M16 57q17-35 34 0 17-35 34 0" fill="#f6e2a9" stroke="#806d5f" stroke-width="2"/><circle cx="40" cy="47" r="2"/><circle cx="59" cy="47" r="2"/><path d="M44 55q6 4 11 0" fill="none" stroke="#806d5f" stroke-width="2"/><path d="M12 19l7 5-4 8 9-3 5 7 1-9 9-2-8-5 3-9-8 5-7-6 1 9z" fill="#e7aeb9"/></svg></div>
<header><div class="tape">SEPTEMBER · 2026</div><p class="eyebrow">OUR FAMILY JOURNAL</p><h1>우리집의 <em>작은 기록</em></h1><p class="subtitle">평범한 하루가 가장 예쁜 추억이 되는 곳</p></header>
<div class="month"><button id="prev" aria-label="이전 달">‹</button><div><small>MONTHLY</small><h2 id="monthTitle"></h2></div><button id="next" aria-label="다음 달">›</button></div>
<div class="legend"><span class="work">어린이집</span><span class="kid">아이</span><span class="me">내 일정</span><span class="spouse">가족</span></div>
<section class="calendar"><div class="week"><b>일</b><b>월</b><b>화</b><b>수</b><b>목</b><b>금</b><b>토</b></div><div id="grid"></div></section>
<div class="bottomline"><button id="today">TODAY</button><span>♡ collect the little moments ♡</span><button id="theme">STICKER</button></div>
<button id="aiOpen" class="ai"><svg viewBox="0 0 70 70"><path d="M18 31c0-18 34-18 34 0v20c-8 7-26 7-34 0z" fill="#fff9f0" stroke="#735d55" stroke-width="2"/><path d="M19 29L10 17l18 7M51 29l9-12-18 7" fill="#efc2cb" stroke="#735d55" stroke-width="2"/><circle cx="29" cy="36" r="2.5"/><circle cx="42" cy="36" r="2.5"/><path d="M30 45q6 5 12 0" fill="none" stroke="#735d55" stroke-width="2" stroke-linecap="round"/><path d="M12 10l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#e4bb65"/></svg><span><b>AI 비서</b><small>일정 말하기</small></span></button>
</div></section></main>
<dialog id="aiDialog"><div class="sheet"><button class="x" data-close="aiDialog">×</button><span class="tag">AI SECRETARY</span><h3>일정을 말해줘</h3><p id="bubble">“29일 저녁 7시 약속”처럼 편하게 적어도 돼.</p><form id="quick"><input id="natural" placeholder="예: 10월 5일 첫째 치과 오후 4시"><button>달력에 붙이기</button></form></div></dialog>
<dialog id="detail"><div class="sheet"><button id="close" class="x">×</button><span class="tag">SCHEDULE NOTE</span><h3>일정 상세</h3><label>일정<input id="dtitle"></label><div class="two"><label>날짜<input id="ddate" type="date"></label><label>시간<input id="dtime" type="time"></label></div><label>분류<select id="dcat"><option value="work">어린이집</option><option value="kid">아이</option><option value="me">내 일정</option><option value="spouse">배우자/가족</option></select></label><label>장소<input id="dplace"></label><label>메모<textarea id="dmemo"></textarea></label><div class="actions"><button id="copy">복사</button><button id="delete">삭제</button><button id="save">저장</button></div></div></dialog>
<script src="app.js?v=6"></script><script>aiOpen.onclick=()=>aiDialog.showModal();document.querySelector('[data-close="aiDialog"]').onclick=()=>aiDialog.close();quick.addEventListener('submit',()=>setTimeout(()=>aiDialog.close(),120));</script></body></html>
